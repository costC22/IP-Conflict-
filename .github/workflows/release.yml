name: Publicar versão Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Compilar e validar
        shell: powershell
        run: .\Build-Executable.ps1

      - name: Publicar artefatos da tag
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "IPConflictMonitor $($tag.TrimStart('v'))" --generate-notes
          }
          gh release upload $tag --clobber `
            dist\IPConflictMonitor.exe `
            dist\IPConflictMonitor-Windows.zip `
            dist\IPConflictMonitor.exe.sha256 `
            dist\IPConflictMonitor-dashboard.png
